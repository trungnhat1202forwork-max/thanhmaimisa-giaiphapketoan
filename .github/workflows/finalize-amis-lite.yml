name: Build AMIS Lite GIF

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/finalize-amis-lite.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Generate GIF and patch landing page
        env:
          GIF_SCRIPT_B64: 
        run: |
          printf '%s' "$GIF_SCRIPT_B64" | base64 -d > /tmp/build_gif.py
          python /tmp/build_gif.py
      - name: Commit GIF update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css assets/amis-lite-orbit.gif
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add AMIS Lite rotating GIF"
          git push
